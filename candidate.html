<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#5b3df5" />
  <title>Candidate Dashboard | PrepiFY</title>

  <style>
    :root {
      --primary: #5b3df5;
      --primary-dark: #3b22c5;
      --purple: #7c3aed;
      --cyan: #12bdd5;
      --pink: #ea4b9b;
      --orange: #ff9f1c;
      --green: #10a56a;
      --red: #d63d35;
      --text: #182033;
      --muted: #657086;
      --border: #e5e8f0;
      --card: rgba(255, 255, 255, 0.94);
      --shadow: 0 17px 44px rgba(18, 12, 83, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family:
        "Segoe UI",
        "Noto Sans Devanagari",
        "Nirmala UI",
        Arial,
        sans-serif;
      background: #4e30e8;
    }

    .animated-bg {
      position: fixed;
      inset: 0;
      z-index: -4;
      overflow: hidden;
      background: linear-gradient(
        125deg,
        #3d21cb 0%,
        #6146f7 28%,
        #13bcd5 51%,
        #e94d9a 76%,
        #ff9f1c 100%
      );
      background-size: 300% 300%;
      animation: gradientMove 16s ease infinite;
    }

    .animated-bg::before,
    .animated-bg::after {
      position: absolute;
      border-radius: 50%;
      content: "";
      opacity: 0.28;
      filter: blur(10px);
    }

    .animated-bg::before {
      top: -22vw;
      left: -18vw;
      width: 60vw;
      height: 60vw;
      background: #fff5ab;
      animation: blobOne 18s ease-in-out infinite alternate;
    }

    .animated-bg::after {
      right: -24vw;
      bottom: -25vw;
      width: 65vw;
      height: 65vw;
      background: #c5f6ff;
      animation: blobTwo 21s ease-in-out infinite alternate;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes blobOne {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(18vw, 10vw) scale(1.15); }
    }

    @keyframes blobTwo {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(-17vw, -9vw) scale(1.2); }
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: -3;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      bottom: -60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.18);
      animation: rise linear infinite;
    }

    @keyframes rise {
      0% {
        opacity: 0;
        transform: translateY(0) translateX(0);
      }
      10% { opacity: 1; }
      85% { opacity: 0.8; }
      100% {
        opacity: 0;
        transform: translateY(-120vh) translateX(85px);
      }
    }

    .page-shell {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 23px;
    }

    .brand-link {
      display: inline-flex;
      flex-direction: column;
      color: #fff;
      text-decoration: none;
    }

    .brand {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1;
      text-shadow: 0 3px 13px rgba(22, 11, 78, 0.27);
    }

    .prepi {
      color: #fff2a5;
    }

    .fy {
      color: #b7f4ff;
    }

    .institute {
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.93);
      font-size: 0.88rem;
      font-weight: 650;
      letter-spacing: 0.2px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .language-switch {
      display: inline-flex;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
    }

    .lang-btn {
      min-width: 67px;
      padding: 8px 10px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: transparent;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 760;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .lang-btn.active {
      color: var(--primary-dark);
      background: #fff;
      box-shadow: 0 2px 10px rgba(20, 12, 82, 0.16);
    }

    .logout-btn {
      padding: 10px 13px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 11px;
      color: #fff;
      background: rgba(91, 23, 115, 0.25);
      box-shadow: 0 4px 14px rgba(29, 8, 80, 0.14);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .logout-btn:hover {
      background: rgba(126, 28, 48, 0.56);
      transform: translateY(-1px);
    }

    .welcome-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 21px;
      padding: clamp(21px, 3vw, 30px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 21px;
      color: #fff;
      background: linear-gradient(
        125deg,
        rgba(49, 27, 170, 0.9),
        rgba(92, 57, 231, 0.75),
        rgba(13, 163, 194, 0.72)
      );
      box-shadow: var(--shadow);
      backdrop-filter: blur(15px);
    }

    .welcome-left h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.05rem);
      line-height: 1.25;
    }

    .candidate-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .summary-pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 50px;
      color: rgba(255, 255, 255, 0.96);
      background: rgba(255, 255, 255, 0.13);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .quote-box {
      max-width: 415px;
      padding: 16px 17px;
      border-left: 4px solid #ffe27f;
      border-radius: 11px;
      color: #fff5b6;
      background: rgba(14, 8, 73, 0.22);
      font-size: 0.91rem;
      font-weight: 700;
      line-height: 1.6;
    }

    .quote-label {
      display: block;
      margin-bottom: 5px;
      color: #ffffff;
      font-size: 0.73rem;
      font-weight: 850;
      letter-spacing: 0.65px;
      text-transform: uppercase;
    }

    .dashboard-card {
      padding: clamp(20px, 3vw, 29px);
      border: 1px solid rgba(255, 255, 255, 0.44);
      border-radius: 21px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(15px);
    }

    .dashboard-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 19px;
    }

    .dashboard-head h2 {
      margin: 0;
      color: var(--text);
      font-size: clamp(1.36rem, 2.5vw, 1.75rem);
    }

    .dashboard-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .refresh-info {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 9px;
      color: #546078;
      background: #f1f3fa;
      font-size: 0.77rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #18a76e;
      box-shadow: 0 0 0 0 rgba(24, 167, 110, 0.55);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(24, 167, 110, 0.55); }
      70% { box-shadow: 0 0 0 8px rgba(24, 167, 110, 0); }
      100% { box-shadow: 0 0 0 0 rgba(24, 167, 110, 0); }
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding-bottom: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .tab-btn {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid #e2e6ee;
      border-radius: 10px;
      color: #5d667b;
      background: #f8f9fc;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .tab-btn.active {
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      box-shadow: 0 7px 15px rgba(91, 61, 245, 0.24);
    }

    .tab-count {
      display: inline-grid;
      min-width: 18px;
      height: 18px;
      margin-left: 5px;
      padding: 0 4px;
      place-items: center;
      border-radius: 50px;
      color: inherit;
      background: rgba(255, 255, 255, 0.22);
      font-size: 0.7rem;
    }

    .tab-btn:not(.active) .tab-count {
      color: #5b3df5;
      background: #e8e5ff;
    }

    .test-panel {
      display: none;
      padding-top: 17px;
    }

    .test-panel.active {
      display: block;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .test-card {
      display: flex;
      min-height: 192px;
      flex-direction: column;
      padding: 18px;
      border: 1px solid #e5e8ef;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 5px 16px rgba(24, 29, 65, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .test-card:hover {
      box-shadow: 0 10px 24px rgba(24, 29, 65, 0.11);
      transform: translateY(-3px);
    }

    .test-card.live {
      border-color: #a9e3ca;
      background: linear-gradient(155deg, #ffffff, #effdf6);
    }

    .test-card.recent {
      border-color: #e2e5ec;
      background: linear-gradient(155deg, #ffffff, #f8f9fc);
    }

    .test-card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .test-name {
      margin: 0;
      color: #202942;
      font-size: 1rem;
      font-weight: 850;
      line-height: 1.35;
      word-break: break-word;
    }

    .status-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 850;
    }

    .status-upcoming {
      color: #4d2dbf;
      background: #ede9fe;
    }

    .status-live {
      color: #057447;
      background: #dff8eb;
    }

    .status-recent {
      color: #697386;
      background: #edf0f5;
    }

    .test-description {
      display: -webkit-box;
      margin: 11px 0 0;
      overflow: hidden;
      color: #687086;
      font-size: 0.85rem;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .test-time {
      margin: 14px 0 0;
      color: #3f4b65;
      font-size: 0.8rem;
      font-weight: 650;
      line-height: 1.55;
    }

    .test-time strong {
      color: #273049;
    }

    .card-actions {
      display: flex;
      gap: 9px;
      margin-top: auto;
      padding-top: 15px;
    }

    .action-btn {
      flex: 1;
      min-height: 39px;
      padding: 9px 11px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .view-btn {
      color: #4c35b7;
      background: #efedff;
    }

    .view-btn:hover {
      background: #e3dfff;
    }

    .attempt-btn {
      color: #fff;
      background: linear-gradient(135deg, #079961, #12b978);
      box-shadow: 0 6px 13px rgba(10, 160, 100, 0.24);
    }

    .attempt-btn:hover {
      box-shadow: 0 9px 17px rgba(10, 160, 100, 0.34);
      transform: translateY(-1px);
    }

    .empty-state {
      display: grid;
      min-height: 215px;
      place-items: center;
      padding: 25px;
      border: 1px dashed #ccd3df;
      border-radius: 15px;
      color: #6a7386;
      background: #fafbfe;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 47px;
      height: 47px;
      margin: 0 auto 10px;
      place-items: center;
      border-radius: 50%;
      color: #5c43d8;
      background: #ebe8ff;
      font-size: 1.35rem;
      font-weight: 900;
    }

    .empty-state h3 {
      margin: 0;
      color: #374158;
      font-size: 1rem;
    }

    .empty-state p {
      margin: 7px 0 0;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .loading-state {
      display: grid;
      min-height: 260px;
      place-items: center;
      color: #5a6279;
      text-align: center;
    }

    .big-spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 12px;
      border: 4px solid #e4e1ff;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      padding: 19px;
      border: 1px solid #ffc2bf;
      border-radius: 13px;
      color: #a12721;
      background: #fff1f0;
      text-align: center;
      line-height: 1.55;
    }

    .retry-btn {
      margin-top: 11px;
      padding: 9px 13px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: var(--primary);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(13, 8, 51, 0.64);
      backdrop-filter: blur(4px);
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      width: min(550px, 100%);
      max-height: min(720px, calc(100vh - 36px));
      overflow-y: auto;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 19px;
      background: #fff;
      box-shadow: 0 28px 70px rgba(10, 6, 52, 0.42);
      animation: modalIn 0.22s ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .modal h2 {
      margin: 0;
      color: #202942;
      font-size: 1.3rem;
      line-height: 1.35;
    }

    .close-btn {
      display: grid;
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 9px;
      color: #596276;
      background: #eff1f6;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-status {
      display: inline-block;
      margin-top: 11px;
      padding: 5px 8px;
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 850;
    }

    .modal-description {
      margin: 18px 0 0;
      padding: 15px;
      border-radius: 11px;
      color: #505a70;
      background: #f7f8fc;
      font-size: 0.9rem;
      line-height: 1.65;
      white-space: pre-line;
      word-break: break-word;
    }

    .detail-list {
      display: grid;
      gap: 10px;
      margin-top: 17px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #edf0f4;
      color: #5c667d;
      font-size: 0.87rem;
      line-height: 1.45;
    }

    .detail-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .detail-label {
      color: #2d3852;
      font-weight: 800;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .modal-action {
      flex: 1;
      padding: 11px 13px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 850;
      cursor: pointer;
    }

    .modal-close-action {
      color: #4f5870;
      background: #edf0f5;
    }

    .modal-attempt-action {
      color: #fff;
      background: linear-gradient(135deg, #079961, #13b978);
      box-shadow: 0 7px 15px rgba(9, 157, 96, 0.24);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      display: none;
      max-width: min(390px, calc(100% - 36px));
      padding: 13px 15px;
      border-radius: 12px;
      color: #fff;
      background: rgba(28, 35, 59, 0.94);
      box-shadow: 0 14px 35px rgba(8, 6, 47, 0.27);
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .toast.show {
      display: block;
      animation: toastIn 0.22s ease;
    }

    .toast.error {
      background: #a72d27;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 870px) {
      .welcome-card {
        grid-template-columns: 1fr;
      }

      .quote-box {
        max-width: none;
      }
    }

    @media (max-width: 670px) {
      .test-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-head {
        flex-direction: column;
      }

      .detail-row {
        grid-template-columns: 1fr;
        gap: 3px;
      }
    }

    @media (max-width: 530px) {
      .page-shell {
        width: min(100% - 22px, 1200px);
        padding-top: 14px;
      }

      .topbar {
        align-items: flex-start;
      }

      .top-actions {
        flex-direction: column;
        align-items: flex-end;
      }

      .lang-btn {
        min-width: 56px;
        padding: 7px 8px;
        font-size: 0.75rem;
      }

      .logout-btn {
        padding: 8px 10px;
        font-size: 0.76rem;
      }

      .welcome-card,
      .dashboard-card {
        border-radius: 17px;
      }

      .welcome-card {
        padding: 22px 18px;
      }

      .dashboard-card {
        padding: 19px 15px;
      }

      .tabs {
        margin-right: -2px;
      }

      .tab-btn {
        padding: 9px 11px;
        font-size: 0.79rem;
      }

      .modal {
        padding: 21px 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="animated-bg"></div>
  <div class="particles" id="particles"></div>

  <main class="page-shell">
    <header class="topbar">
      <a href="index.html" class="brand-link" aria-label="PrepiFY Home">
        <div class="brand">
          <span class="prepi">Prepi</span><span class="fy">FY</span>
        </div>
        <div class="institute">GyaanSetu Maths</div>
      </a>

      <div class="top-actions">
        <div class="language-switch" aria-label="Language selector">
          <button id="englishButton" class="lang-btn active" type="button">
            English
          </button>
          <button id="hindiButton" class="lang-btn" type="button">
            हिन्दी
          </button>
        </div>

        <button id="logoutButton" class="logout-btn" type="button" data-i18n="logout">
          Logout
        </button>
      </div>
    </header>

    <section class="welcome-card">
      <div class="welcome-left">
        <h1>
          <span data-i18n="welcome">Welcome</span>,
          <span id="candidateName">Candidate</span>!
        </h1>

        <div class="candidate-summary">
          <span class="summary-pill">
            <span data-i18n="uid">UID</span>:&nbsp;<span id="candidateUid">—</span>
          </span>

          <span class="summary-pill" id="candidateEmail">—</span>
        </div>
      </div>

      <div class="quote-box">
        <span class="quote-label" data-i18n="dailyMotivation">Daily Motivation</span>
        <span id="quoteText">Loading motivational quote...</span>
      </div>
    </section>

    <section class="dashboard-card">
      <div class="dashboard-head">
        <div>
          <h2 data-i18n="testsHeading">My Tests</h2>
          <p data-i18n="testsSubtitle">
            View scheduled tests and attempt live tests during their active time.
          </p>
        </div>

        <div class="refresh-info">
          <span class="pulse-dot"></span>
          <span data-i18n="autoRefresh">Auto-refreshes every 30 seconds</span>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button
          class="tab-btn active"
          type="button"
          data-tab="upcoming"
          role="tab"
          aria-selected="true"
        >
          <span data-i18n="upcoming">Upcoming</span>
          <span id="upcomingCount" class="tab-count">0</span>
        </button>

        <button
          class="tab-btn"
          type="button"
          data-tab="live"
          role="tab"
          aria-selected="false"
        >
          <span data-i18n="live">Live</span>
          <span id="liveCount" class="tab-count">0</span>
        </button>

        <button
          class="tab-btn"
          type="button"
          data-tab="recent"
          role="tab"
          aria-selected="false"
        >
          <span data-i18n="recent">Recent</span>
          <span id="recentCount" class="tab-count">0</span>
        </button>
      </div>

      <div id="upcomingPanel" class="test-panel active" role="tabpanel"></div>
      <div id="livePanel" class="test-panel" role="tabpanel"></div>
      <div id="recentPanel" class="test-panel" role="tabpanel"></div>
    </section>
  </main>

  <div id="testModalOverlay" class="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTestName">
      <div class="modal-top">
        <div>
          <h2 id="modalTestName"></h2>
          <span id="modalStatus" class="modal-status"></span>
        </div>

        <button
          id="modalCloseIcon"
          class="close-btn"
          type="button"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <div id="modalDescription" class="modal-description"></div>

      <div class="detail-list">
        <div class="detail-row">
          <span class="detail-label" data-i18n="startTime">Start Time</span>
          <span id="modalStartTime"></span>
        </div>

        <div class="detail-row">
          <span class="detail-label" data-i18n="endTime">End Time</span>
          <span id="modalEndTime"></span>
        </div>

        <div class="detail-row">
          <span class="detail-label" data-i18n="testStatus">Status</span>
          <span id="modalStatusText"></span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="modalCloseButton" class="modal-action modal-close-action" type="button" data-i18n="close">
          Close
        </button>

        <button
          id="modalAttemptButton"
          class="modal-action modal-attempt-action"
          type="button"
          style="display: none"
          data-i18n="attemptNow"
        >
          Attempt Now
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    /*
      Use the same deployed Google Apps Script Web App /exec URL
      that you used in register.html and login.html.
    */
    const GAS_URL =
      "https://script.google.com/macros/s/AKfycby-m3o9rQfaRIn51M8Z-18xpIfKFPGmXmRbExyBhv6e1yKVZfvmFi7mVMsCw4zgHmPs/exec";

    const REFRESH_INTERVAL_MS = 30000;

    const translations = {
      en: {
        title: "Candidate Dashboard | PrepiFY",
        welcome: "Welcome",
        uid: "UID",
        logout: "Logout",
        dailyMotivation: "Daily Motivation",
        testsHeading: "My Tests",
        testsSubtitle:
          "View scheduled tests and attempt live tests during their active time.",
        autoRefresh: "Auto-refreshes every 30 seconds",
        upcoming: "Upcoming",
        live: "Live",
        recent: "Recent",
        viewDetails: "View Details",
        attemptNow: "Attempt Now",
        noUpcomingTitle: "No upcoming tests",
        noUpcomingText: "New tests will appear here when scheduled by the admin.",
        noLiveTitle: "No live tests right now",
        noLiveText: "Please check again at the scheduled test time.",
        noRecentTitle: "No recent tests",
        noRecentText: "Completed tests will appear here.",
        loading: "Loading your dashboard...",
        unableLoad: "Unable to load your dashboard.",
        retry: "Retry",
        startTime: "Start Time",
        endTime: "End Time",
        testStatus: "Status",
        close: "Close",
        statusUpcoming: "Upcoming",
        statusLive: "Live Now",
        statusRecent: "Completed",
        logoutConfirm: "Do you want to log out from your dashboard?",
        loginExpired: "Your login session has expired. Please log in again.",
        invalidTestLink: "Test link is not available yet. Please contact the admin.",
        openingTest: "Opening test portal...",
        loginFirst: "Please log in first to access the dashboard."
      },

      hi: {
        title: "कैंडिडेट डैशबोर्ड | PrepiFY",
        welcome: "स्वागत है",
        uid: "UID",
        logout: "लॉग आउट",
        dailyMotivation: "आज की प्रेरणा",
        testsHeading: "मेरे टेस्ट",
        testsSubtitle:
          "निर्धारित टेस्ट देखें और लाइव टेस्ट के समय उन्हें attempt करें।",
        autoRefresh: "हर 30 सेकंड में अपडेट होता है",
        upcoming: "आगामी",
        live: "लाइव",
        recent: "हाल के",
        viewDetails: "विवरण देखें",
        attemptNow: "अभी टेस्ट दें",
        noUpcomingTitle: "कोई आगामी टेस्ट नहीं है",
        noUpcomingText: "Admin द्वारा नया टेस्ट schedule होने पर वह यहाँ दिखाई देगा।",
        noLiveTitle: "अभी कोई लाइव टेस्ट नहीं है",
        noLiveText: "निर्धारित टेस्ट समय पर दोबारा देखें।",
        noRecentTitle: "कोई हाल का टेस्ट नहीं है",
        noRecentText: "पूरे हो चुके टेस्ट यहाँ दिखाई देंगे।",
        loading: "आपका डैशबोर्ड लोड हो रहा है...",
        unableLoad: "डैशबोर्ड लोड नहीं हो पाया।",
        retry: "फिर से प्रयास करें",
        startTime: "शुरू होने का समय",
        endTime: "समाप्त होने का समय",
        testStatus: "स्थिति",
        close: "बंद करें",
        statusUpcoming: "आगामी",
        statusLive: "लाइव",
        statusRecent: "पूर्ण",
        logoutConfirm: "क्या आप डैशबोर्ड से लॉग आउट करना चाहते हैं?",
        loginExpired: "आपका लॉगिन सेशन समाप्त हो गया है। कृपया दोबारा लॉगिन करें।",
        invalidTestLink: "टेस्ट लिंक अभी उपलब्ध नहीं है। कृपया admin से संपर्क करें।",
        openingTest: "टेस्ट पोर्टल खोला जा रहा है...",
        loginFirst: "डैशबोर्ड देखने के लिए पहले लॉगिन करें।"
      }
    };

    let currentLanguage = localStorage.getItem("prepifyLanguage") || "en";
    let candidateToken = localStorage.getItem("prepifyCandidateToken");
    let dashboardData = null;
    let allTests = [];
    let activeTab = "upcoming";
    let selectedTest = null;
    let refreshTimer = null;
    let toastTimer = null;

    const englishButton = document.getElementById("englishButton");
    const hindiButton = document.getElementById("hindiButton");
    const logoutButton = document.getElementById("logoutButton");

    const candidateNameElement = document.getElementById("candidateName");
    const candidateUidElement = document.getElementById("candidateUid");
    const candidateEmailElement = document.getElementById("candidateEmail");
    const quoteTextElement = document.getElementById("quoteText");

    const upcomingPanel = document.getElementById("upcomingPanel");
    const livePanel = document.getElementById("livePanel");
    const recentPanel = document.getElementById("recentPanel");

    const upcomingCount = document.getElementById("upcomingCount");
    const liveCount = document.getElementById("liveCount");
    const recentCount = document.getElementById("recentCount");

    const testModalOverlay = document.getElementById("testModalOverlay");
    const modalTestName = document.getElementById("modalTestName");
    const modalStatus = document.getElementById("modalStatus");
    const modalStatusText = document.getElementById("modalStatusText");
    const modalDescription = document.getElementById("modalDescription");
    const modalStartTime = document.getElementById("modalStartTime");
    const modalEndTime = document.getElementById("modalEndTime");
    const modalCloseIcon = document.getElementById("modalCloseIcon");
    const modalCloseButton = document.getElementById("modalCloseButton");
    const modalAttemptButton = document.getElementById("modalAttemptButton");

    const toast = document.getElementById("toast");

    function getText(key) {
      return translations[currentLanguage][key] || translations.en[key] || key;
    }

    function setLanguage(language) {
      currentLanguage = language === "hi" ? "hi" : "en";
      localStorage.setItem("prepifyLanguage", currentLanguage);

      document.documentElement.lang = currentLanguage === "hi" ? "hi" : "en";
      document.title = getText("title");

      englishButton.classList.toggle("active", currentLanguage === "en");
      hindiButton.classList.toggle("active", currentLanguage === "hi");

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.getAttribute("data-i18n");
        element.textContent = getText(key);
      });

      renderTests();

      if (selectedTest) {
        openTestModal(selectedTest);
      }
    }

    function createParticles() {
      const particleContainer = document.getElementById("particles");
      const total = window.innerWidth < 600 ? 16 : 29;

      for (let i = 0; i < total; i += 1) {
        const particle = document.createElement("span");
        const size = Math.floor(Math.random() * 24) + 8;

        particle.className = "particle";
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.animationDuration = `${Math.random() * 13 + 12}s`;
        particle.style.animationDelay = `${Math.random() * 12}s`;
        particle.style.opacity = `${Math.random() * 0.35 + 0.12}`;

        particleContainer.appendChild(particle);
      }
    }

    function showToast(message, type = "") {
      window.clearTimeout(toastTimer);

      toast.textContent = message;
      toast.className = `toast show ${type}`.trim();

      toastTimer = window.setTimeout(() => {
        toast.className = "toast";
      }, 3500);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getLocalStatus(test) {
      const now = new Date();
      const start = new Date(test.startDateTime);
      const end = new Date(test.endDateTime);

      if (now < start) return "Upcoming";
      if (now >= start && now <= end) return "Live";
      return "Recent";
    }

    function getStatusLabel(status) {
      if (status === "Live") return getText("statusLive");
      if (status === "Recent") return getText("statusRecent");
      return getText("statusUpcoming");
    }

    function formatDateTime(dateValue) {
      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) return "—";

      return new Intl.DateTimeFormat(
        currentLanguage === "hi" ? "hi-IN" : "en-IN",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      ).format(date);
    }

    function getGroupedTests() {
      const grouped = {
        Upcoming: [],
        Live: [],
        Recent: []
      };

      allTests.forEach((test) => {
        const calculatedStatus = getLocalStatus(test);
        const normalizedTest = {
          ...test,
          status: calculatedStatus
        };

        if (grouped[calculatedStatus]) {
          grouped[calculatedStatus].push(normalizedTest);
        }
      });

      grouped.Upcoming.sort(
        (a, b) => new Date(a.startDateTime) - new Date(b.startDateTime)
      );

      grouped.Live.sort(
        (a, b) => new Date(a.endDateTime) - new Date(b.endDateTime)
      );

      grouped.Recent.sort(
        (a, b) => new Date(b.endDateTime) - new Date(a.endDateTime)
      );

      return grouped;
    }

    function createEmptyState(type) {
      let title = "";
      let text = "";
      let icon = "◌";

      if (type === "Upcoming") {
        title = getText("noUpcomingTitle");
        text = getText("noUpcomingText");
        icon = "◷";
      } else if (type === "Live") {
        title = getText("noLiveTitle");
        text = getText("noLiveText");
        icon = "●";
      } else {
        title = getText("noRecentTitle");
        text = getText("noRecentText");
        icon = "✓";
      }

      return `
        <div class="empty-state">
          <div>
            <div class="empty-icon">${icon}</div>
            <h3>${escapeHtml(title)}</h3>
            <p>${escapeHtml(text)}</p>
          </div>
        </div>
      `;
    }

    function createTestCard(test) {
      const status = test.status;
      const statusClass =
        status === "Live"
          ? "live"
          : status === "Recent"
            ? "recent"
            : "upcoming";

      const badgeClass =
        status === "Live"
          ? "status-live"
          : status === "Recent"
            ? "status-recent"
            : "status-upcoming";

      const attemptButton =
        status === "Live"
          ? `
            <button
              class="action-btn attempt-btn"
              type="button"
              data-action="attempt"
              data-test-id="${escapeHtml(test.testId)}"
            >
              ${escapeHtml(getText("attemptNow"))}
            </button>
          `
          : "";

      return `
        <article class="test-card ${statusClass}">
          <div class="test-card-top">
            <h3 class="test-name">${escapeHtml(test.testName)}</h3>
            <span class="status-badge ${badgeClass}">
              ${escapeHtml(getStatusLabel(status))}
            </span>
          </div>

          <p class="test-description">
            ${escapeHtml(test.testDescription || "—")}
          </p>

          <div class="test-time">
            <strong>${escapeHtml(getText("startTime"))}:</strong><br>
            ${escapeHtml(formatDateTime(test.startDateTime))}
          </div>

          <div class="card-actions">
            <button
              class="action-btn view-btn"
              type="button"
              data-action="view"
              data-test-id="${escapeHtml(test.testId)}"
            >
              ${escapeHtml(getText("viewDetails"))}
            </button>
            ${attemptButton}
          </div>
        </article>
      `;
    }

    function renderPanel(panel, tests, type) {
      if (!tests.length) {
        panel.innerHTML = createEmptyState(type);
        return;
      }

      panel.innerHTML = `
        <div class="test-grid">
          ${tests.map(createTestCard).join("")}
        </div>
      `;
    }

    function renderTests() {
      const grouped = getGroupedTests();

      upcomingCount.textContent = grouped.Upcoming.length;
      liveCount.textContent = grouped.Live.length;
      recentCount.textContent = grouped.Recent.length;

      renderPanel(upcomingPanel, grouped.Upcoming, "Upcoming");
      renderPanel(livePanel, grouped.Live, "Live");
      renderPanel(recentPanel, grouped.Recent, "Recent");

      switchTab(activeTab);
    }

    function switchTab(tab) {
      activeTab = tab;

      const panels = {
        upcoming: upcomingPanel,
        live: livePanel,
        recent: recentPanel
      };

      document.querySelectorAll(".tab-btn").forEach((button) => {
        const isActive = button.dataset.tab === tab;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-selected", isActive ? "true" : "false");
      });

      Object.entries(panels).forEach(([key, panel]) => {
        panel.classList.toggle("active", key === tab);
      });
    }

    function findTest(testId) {
      return allTests.find((test) => test.testId === testId);
    }

    function openTestModal(test) {
      if (!test) return;

      selectedTest = {
        ...test,
        status: getLocalStatus(test)
      };

      const status = selectedTest.status;

      modalTestName.textContent = selectedTest.testName || "Test";
      modalDescription.textContent = selectedTest.testDescription || "—";
      modalStartTime.textContent = formatDateTime(selectedTest.startDateTime);
      modalEndTime.textContent = formatDateTime(selectedTest.endDateTime);
      modalStatusText.textContent = getStatusLabel(status);

      modalStatus.textContent = getStatusLabel(status);
      modalStatus.className =
        "modal-status " +
        (status === "Live"
          ? "status-live"
          : status === "Recent"
            ? "status-recent"
            : "status-upcoming");

      modalAttemptButton.style.display = status === "Live" ? "block" : "none";

      testModalOverlay.classList.add("visible");
      testModalOverlay.setAttribute("aria-hidden", "false");
    }

    function closeTestModal() {
      selectedTest = null;
      testModalOverlay.classList.remove("visible");
      testModalOverlay.setAttribute("aria-hidden", "true");
    }

    function attemptTest(test) {
      if (!test) return;

      const currentStatus = getLocalStatus(test);

      if (currentStatus !== "Live") {
        showToast(getText("noLiveText"), "error");
        renderTests();
        return;
      }

      if (!test.testLink || !/^https?:\/\//i.test(test.testLink)) {
        showToast(getText("invalidTestLink"), "error");
        return;
      }

      showToast(getText("openingTest"));

      window.open(test.testLink, "_blank", "noopener,noreferrer");
    }

    function showLoadingState() {
      const loadingMarkup = `
        <div class="loading-state">
          <div>
            <div class="big-spinner"></div>
            <div>${escapeHtml(getText("loading"))}</div>
          </div>
        </div>
      `;

      upcomingPanel.innerHTML = loadingMarkup;
      livePanel.innerHTML = loadingMarkup;
      recentPanel.innerHTML = loadingMarkup;
    }

    function showErrorState(message) {
      const errorMarkup = `
        <div class="error-box">
          <div>${escapeHtml(message)}</div>
          <button id="retryButton" class="retry-btn" type="button">
            ${escapeHtml(getText("retry"))}
          </button>
        </div>
      `;

      upcomingPanel.innerHTML = errorMarkup;
      livePanel.innerHTML = errorMarkup;
      recentPanel.innerHTML = errorMarkup;

      const retryButton = document.getElementById("retryButton");
      if (retryButton) {
        retryButton.addEventListener("click", loadDashboard);
      }
    }

    async function loadDashboard() {
      if (!candidateToken) {
        showToast(getText("loginFirst"), "error");

        window.setTimeout(() => {
          window.location.href = "login.html";
        }, 500);

        return;
      }

      showLoadingState();

      try {
        const endpoint =
          GAS_URL +
          "?action=getCandidateDashboard&token=" +
          encodeURIComponent(candidateToken) +
          "&_=" +
          Date.now();

        const response = await fetch(endpoint, {
          method: "GET",
          redirect: "follow"
        });

        const responseText = await response.text();

        let result;
        try {
          result = JSON.parse(responseText);
        } catch (error) {
          throw new Error("INVALID_RESPONSE");
        }

        if (!result || !result.success) {
          const message =
            (result && result.message) || getText("loginExpired");

          if (
            /session|login|token|expired|candidate/i.test(message)
          ) {
            localStorage.removeItem("prepifyCandidateToken");
            localStorage.removeItem("prepifyCandidate");

            showToast(getText("loginExpired"), "error");

            window.setTimeout(() => {
              window.location.href = "login.html";
            }, 700);

            return;
          }

          throw new Error(message);
        }

        dashboardData = result;

        if (result.candidate) {
          candidateNameElement.textContent = result.candidate.name || "Candidate";
          candidateUidElement.textContent = result.candidate.uid || "—";
          candidateEmailElement.textContent = result.candidate.email || "—";

          localStorage.setItem(
            "prepifyCandidate",
            JSON.stringify(result.candidate)
          );

          if (result.candidate.language) {
            currentLanguage =
              result.candidate.language === "hi" ? "hi" : currentLanguage;
          }
        }

        quoteTextElement.textContent =
          result.quote || "Small, consistent efforts create great results.";

        allTests = Array.isArray(result.tests) ? result.tests : [];

        setLanguage(currentLanguage);

      } catch (error) {
        console.error("Dashboard loading error:", error);

        const displayMessage =
          error.message === "INVALID_RESPONSE"
            ? getText("unableLoad")
            : error.message || getText("unableLoad");

        showErrorState(displayMessage);
      }
    }

    async function logout() {
      const confirmed = window.confirm(getText("logoutConfirm"));

      if (!confirmed) return;

      /*
        Backend logout is optional. Local token removal is sufficient
        for client-side logout, but this makes the server cache token
        invalid if the request succeeds.
      */
      try {
        if (candidateToken) {
          await fetch(GAS_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              action: "candidateLogout",
              token: candidateToken
            }),
            redirect: "follow"
          });
        }
      } catch (error) {
        console.warn("Server logout request failed:", error);
      } finally {
        localStorage.removeItem("prepifyCandidateToken");
        localStorage.removeItem("prepifyCandidate");

        window.location.href = "index.html";
      }
    }

    englishButton.addEventListener("click", () => setLanguage("en"));
    hindiButton.addEventListener("click", () => setLanguage("hi"));

    logoutButton.addEventListener("click", logout);

    document.querySelectorAll(".tab-btn").forEach((button) => {
      button.addEventListener("click", () => {
        switchTab(button.dataset.tab);
      });
    });

    document.addEventListener("click", (event) => {
      const actionButton = event.target.closest("[data-action]");

      if (!actionButton) return;

      const testId = actionButton.dataset.testId;
      const test = findTest(testId);

      if (actionButton.dataset.action === "view") {
        openTestModal(test);
      }

      if (actionButton.dataset.action === "attempt") {
        attemptTest(test);
      }
    });

    modalCloseIcon.addEventListener("click", closeTestModal);
    modalCloseButton.addEventListener("click", closeTestModal);

    modalAttemptButton.addEventListener("click", () => {
      attemptTest(selectedTest);
    });

    testModalOverlay.addEventListener("click", (event) => {
      if (event.target === testModalOverlay) {
        closeTestModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeTestModal();
      }
    });

    createParticles();
    setLanguage(currentLanguage);
    loadDashboard();

    refreshTimer = window.setInterval(() => {
      loadDashboard();
    }, REFRESH_INTERVAL_MS);

    window.addEventListener("beforeunload", () => {
      if (refreshTimer) {
        window.clearInterval(refreshTimer);
      }
    });
  </script>
</body>
</html>
