<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PrepiFY - GyaanSetu Maths</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg1: #4f46e5;
      --bg2: #f59e0b;
      --bg3: #06b6d4;
      --bg4: #ec4899;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-dark: #111827;
      --text-muted: #4b5563;
      --accent: #7c3aed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-dark);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated gradient background */
    .animated-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(
        120deg,
        var(--bg1),
        var(--bg2),
        var(--bg3),
        var(--bg4),
        var(--bg1)
      );
      background-size: 300% 300%;
      animation: gradientShift 12s ease infinite;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.6);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-20vh) scale(1);
        opacity: 0;
      }
    }

    .header {
      text-align: center;
      padding: 24px 10px 12px;
      position: relative;
      z-index: 1;
    }

    .brand {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
      color: #fff;
    }

    .brand span.c1 {
      color: #ffd56b;
    }
    .brand span.c2 {
      color: #93c5fd;
    }

    .subbrand {
      font-size: 22px;
      color: #fff;
      margin-top: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .tagline {
      font-size: 17px;
      color: #f3f4f6;
      margin-top: 8px;
      font-style: italic;
      text-shadow: 0 1px 6px rgba(0,0,0,0.35);
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      max-width: 1100px;
      margin: 30px auto;
      gap: 30px;
      padding: 0 15px;
      position: relative;
      z-index: 1;
    }

    .left-panel,
    .right-panel {
      flex: 1 1 320px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      backdrop-filter: blur(6px);
    }

    h2 {
      margin-top: 0;
      color: #1f2937;
    }

    .quote-box {
      background: #f9fafb;
      border-left: 5px solid var(--accent);
      padding: 16px 16px 16px 20px;
      border-radius: 8px;
      margin-bottom: 18px;
      transition: all 0.35s ease;
    }

    .shlok {
      font-size: 19px;
      color: #111827;
      margin-bottom: 6px;
      line-height: 1.45;
      font-weight: 600;
    }

    .arth {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .custom-tagline {
      font-size: 17px;
      color: var(--accent);
      font-weight: 700;
      text-align: center;
      margin-top: 18px;
      line-height: 1.45;
      text-shadow: 0 1px 4px rgba(124, 58, 237, 0.15);
    }

    .login-box h3 {
      margin-top: 0;
      text-align: center;
      color: #111827;
      font-size: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px 0;
      margin: 10px 0 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
    }

    .btn-secondary {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: #111827;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      opacity: 0.95;
    }

    /* Language switcher */
    .lang-switcher {
      position: absolute;
      top: 14px;
      right: 16px;
      z-index: 10;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #fff;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(0,0,0,0.25);
    }

    @media (max-width: 700px) {
      .container {
        flex-direction: column;
      }
      .brand {
        font-size: 38px;
      }
      .subbrand {
        font-size: 18px;
      }
      .tagline {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <!-- Animated background -->
  <div class="animated-bg"></div>
  <div class="particles" id="particles"></div>

  <!-- Language switcher -->
  <div class="lang-switcher">
    <button id="langToggle" class="lang-btn">हिन्दी</button>
  </div>

  <div class="header">
    <div class="brand">
      <span class="c1">Prepi</span><span class="c2">FY</span>
    </div>
    <div class="subbrand" data-i18n="subbrand">GyaanSetu Maths</div>
    <div class="tagline" data-i18n="tagline">Empowering minds, building futures.</div>
  </div>

  <div class="container">
    <div class="left-panel">
      <h2 data-i18n="motivationalCorner">Motivational Corner</h2>
      <div id="quoteBox" class="quote-box">
        <div id="shlok" class="shlok"></div>
        <div id="arth" class="arth"></div>
      </div>
      <div class="custom-tagline" data-i18n="customTagline">
        पढ़ लो चाहे कहीं से,<br>
        मंज़िल का रास्ता मिलेगा यहीं से।
      </div>
    </div>

    <div class="right-panel">
      <div class="login-box">
        <h3 data-i18n="loginTitle">Login to your personalised dashboard</h3>
       <a href="login.html" class="btn btn-primary" data-i18n="loginBtn">Login</a>
        <a href="register.html" class="btn btn-secondary" data-i18n="registerBtn">Register Here</a>
      </div>
    </div>
  </div>

  <script>
    // ---------------- Language Data ----------------
    const translations = {
      en: {
        subbrand: "GyaanSetu Maths",
        tagline: "Empowering minds, building futures.",
        motivationalCorner: "Motivational Corner",
        customTagline: "Study from anywhere,<br>the path to your goal starts here.",
        loginTitle: "Login to your personalised dashboard",
        loginBtn: "Login",
        registerBtn: "Register Here",
        shlokLabel: "Shlok",
        arthLabel: "Meaning"
      },
      hi: {
        subbrand: "ज्ञानसेतु Maths",
        tagline: "मन को सशक्त बनाना, भविष्य को गढ़ना।",
        motivationalCorner: "प्रेरणा कोना",
        customTagline: "पढ़ लो चाहे कहीं से,<br>मंज़िल का रास्ता मिलेगा यहीं से।",
        loginTitle: "अपने पर्सनलाइज़्ड डैशबोर्ड में लॉग इन करें",
        loginBtn: "लॉग इन",
        registerBtn: "यहाँ रजिस्टर करें",
        shlokLabel: "श्लोक",
        arthLabel: "अर्थ"
      }
    };

    const quotes = [
      {
        shlok: "कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।",
        arth: "तेरा कर्म करने पर ही अधिकार है, फल पर नहीं।"
      },
      {
        shlok: "योगः कर्मसु कौशलम्।",
        arth: "कर्मों में कुशलता ही योग है।"
      },
      {
        shlok: "उद्धरेदात्मनात्मानं नात्मानमवसादयेत्।",
        arth: "मनुष्य को अपने द्वारा अपना उद्धार करना चाहिए, अपने को गिरना नहीं चाहिए।"
      },
      {
        shlok: "मनो एव बन्धुः आत्मनो, मनो एव रिपुः आत्मनः।",
        arth: "मन ही अपना मित्र है और मन ही अपना शत्रु।"
      }
    ];

    let currentLang = 'en';
    let quoteIndex = 0;

    // ---------------- Language Toggle ----------------
    const langToggleBtn = document.getElementById('langToggle');

    function setLanguage(lang) {
      currentLang = lang;
      langToggleBtn.textContent = lang === 'en' ? 'हिन्दी' : 'English';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerHTML = translations[lang][key];
        }
      });

      // Re-render current quote in selected language (same text, just labels if needed)
      renderQuote();
    }

    langToggleBtn.addEventListener('click', () => {
      setLanguage(currentLang === 'en' ? 'hi' : 'en');
    });

    // ---------------- Quote Rotation ----------------
    function renderQuote() {
      const q = quotes[quoteIndex];
      document.getElementById('shlok').textContent = q.shlok;
      document.getElementById('arth').textContent = q.arth;
    }

    function rotateQuote() {
      renderQuote();
      quoteIndex = (quoteIndex + 1) % quotes.length;
    }

    rotateQuote();
    setInterval(rotateQuote, 6000); // change every 6 seconds

    // ---------------- Animated Particles ----------------
    function createParticles() {
      const container = document.getElementById('particles');
      const particleCount = 25;

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'particle';

        const size = Math.random() * 25 + 10; // 10–35px
        p.style.width = size + 'px';
        p.style.height = size + 'px';

        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (Math.random() * 10 + 10) + 's'; // 10–20s
        p.style.animationDelay = (Math.random() * 5) + 's';

        container.appendChild(p);
      }
    }

    createParticles();

    // Initialize language (default English)
    setLanguage('en');
  </script>
</body>
</html>
